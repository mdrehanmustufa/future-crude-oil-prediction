name: Market refresh and retraining

on:
  push:
    branches:
      - main
      - integration-test
      - dashboard-ux-refresh
      - next-session-forecast-validation
      - feature/scenario-range-and-return-clarity
    paths-ignore:
      - "Final_Dataset_AI_dxy_fixed.csv"
      - "model_artifacts.joblib"
      - "data_refresh_status.json"
      - "data_backups/**"
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile app.py forecast_engine.py scripts/refresh_and_train.py scripts/smoke_test_app.py

      - name: Refresh verified market data and retrain models
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/refresh_and_train.py

      - name: Run dashboard and scenario smoke tests
        run: python scripts/smoke_test_app.py

      - name: Commit refreshed dataset, models and metadata to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Final_Dataset_AI_dxy_fixed.csv model_artifacts.joblib data_refresh_status.json data_backups/
          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "Automated market refresh and model retraining"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
